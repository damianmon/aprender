<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda Appwise</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1>Appwise Store</h1>
      <button id="btnCarrito">🛒 Carrito (<span id="contador">0</span>)</button>
    </header>

    <main class="contenedor">
      <section class="productos">
        <h2>Nuestros Productos</h2>

        <div class="grid">
          <div class="card">
            <img src="assets/auricular_gamer.webp" />
            <h3>Auriculares Inalámbricos</h3>
            <p>$49.99</p>
            <button class="agregar">Añadir al carrito</button>
          </div>

          <div class="card">
            <img src="assets/teclado_mecanico.webp" />
            <h3>Teclado Mecánico</h3>
            <p>$99.99</p>
            <button class="agregar">Añadir al carrito</button>
          </div>

          <div class="card">
            <img src="assets/mouse_gamer.webp" />
            <h3>Mouse Gamer RGB</h3>
            <p>$29.99</p>
            <button class="agregar">Añadir al carrito</button>
          </div>
        </div>
      </section>

      <aside class="carrito">
        <h2>Resumen de Compra</h2>

        <ul id="listaCarrito"></ul>

        <h3>Total: $<span id="total">0</span></h3>
        <button class="finalizar">Finalizar Compra</button>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
