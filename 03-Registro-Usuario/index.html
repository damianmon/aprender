<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>"Registro - Appwise</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Únete a la Comunidad Appwise</h1>

      <div class="form-box">
        <form>
          <label>Nombre Completo:</label>
          <input type="text" placeholder="Ej: Juan Pérez" required />

          <label>Correo Electrónico:</label>
          <input type="email" placeholder="tu@email.com" required />

          <label>Contraseña:</label>
          <input type="password" required />

          <label>Fecha de Nacimiento:</label>
          <input type="date" />

          <label>Nivel en Programación:</label>
          <select>
            <option>Trainee</option>
            <option>Junior</option>
            <option>Semi-Senior</option>
          </select>

          <p><strong>¿Cuál es tu especialidad favorita?</strong></p>

          <label><input type="radio" name="esp" /> Frontend</label>
          <label><input type="radio" name="esp" /> Backend</label>

          <label class="check">
            <input type="checkbox" required />
            Acepto los términos y condiciones
          </label>

          <button type="submit">Crear Cuenta</button>
        </form>
      </div>
    </div>
  </body>
</html>
