<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Tareas</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="app">
      <h1>Mis Tareas Pendientes</h1>

      <section class="input-group">
        <input
          id="inputTarea"
          type="text"
          placeholder="¿Qué necesitas hacer hoy?"
        />
        <button id="btnAgregar">Agregar Tarea</button>
      </section>

      <ul id="lista" class="lista"></ul>

      <p class="footer">
        <span id="contador">Tienes 0 tareas pendientes.</span>
        <button id="btnLimpiar" class="btn-limpiar">Limpiar Completadas</button>
      </p>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
